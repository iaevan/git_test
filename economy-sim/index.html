<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Village Economy Sandbox</title>
<style>
:root{
  --bg:#1d212b; --panel:#272c38; --panel2:#2f3542; --line:#3c4352; --text:#e8e6e1; --muted:#9aa1ad;
  --accent:#f2b75b; --good:#7fc97f; --bad:#ef6f6c; --blue:#6fa8dc; --orange:#f39c4a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on,button.primary{background:var(--accent);color:#222;border-color:var(--accent)}
button.danger{border-color:#7a3b3b;color:#f3a3a1}
input,select,textarea{background:#1a1e27;border:1px solid var(--line);border-radius:5px;padding:3px 6px}
input[type=number]{width:70px}
input[type=checkbox]{width:auto}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#161922;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;color:var(--accent);letter-spacing:.3px}
#clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
#hudmoney{color:var(--muted)}
main{display:flex;gap:12px;padding:12px;align-items:flex-start}
#left{flex:1 1 60%;min-width:0}
#right{flex:1 1 40%;min-width:340px;max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
@media (max-width:1000px){main{flex-direction:column}#right{max-width:none;width:100%;min-width:0;max-height:none}}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.pal{display:inline-flex;align-items:center;gap:4px}
#mapwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#3d6b35}
canvas#map{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
#ticker{margin-top:8px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:96px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:hidden}
nav#tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line)}
nav#tabs button{border:none;border-radius:6px 6px 0 0;background:transparent;color:var(--muted);padding:6px 9px}
nav#tabs button.on{background:var(--panel2);color:var(--text)}
#panel{padding:12px;overflow:auto;flex:1}
h2{font-size:14px;margin:4px 0 10px;color:var(--accent)}
h3{font-size:13px;margin:14px 0 6px;color:var(--text)}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.card .head{display:flex;align-items:center;gap:8px;cursor:pointer}
.card .head .grow{flex:1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.row label{color:var(--muted);font-size:12px}
.field{display:inline-flex;flex-direction:column;gap:2px}
.field>span{font-size:11px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:3px 5px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.days{display:inline-flex;gap:1px}
.days button{padding:1px 4px;font-size:11px;min-width:20px;border-radius:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.kv div:nth-child(odd){color:var(--muted)}
.chartbox{background:#1a1e27;border:1px solid var(--line);border-radius:8px;padding:6px;margin:6px 0 10px}
.chartbox canvas{width:100%;display:block}
.chartbox .t{font-size:12px;color:var(--muted);margin:0 0 4px 2px}
.pill{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;background:#1a1e27;border:1px solid var(--line)}
textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.small{font-size:11px}
.rules p,.rules li{color:#d6d3cc}
.rules code{background:#1a1e27;padding:0 4px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>🏘️ Village Economy Sandbox</h1>
  <span id="clock">Day 1 · Mon · 00:00</span>
  <span id="hudmoney"></span>
</header>
<main>
  <section id="left">
    <div class="bar" id="tools"></div>
    <div id="mapwrap"><canvas id="map"></canvas></div>
    <div class="bar" style="margin-top:8px">
      <button id="playBtn" class="primary">▶ Play</button>
      <label class="muted">Speed
        <select id="speed">
          <option value="5">Slow · 5 min/s</option>
          <option value="15" selected>Normal · 15 min/s</option>
          <option value="60">Fast · 1 h/s</option>
          <option value="240">Faster · 4 h/s</option>
          <option value="1440">Max · 1 day/s</option>
        </select>
      </label>
      <span class="sep"></span>
      <button id="endDayBtn" title="Simulate instantly until the start of the next day">⏭ Finish day</button>
      <label class="muted">Run <input id="runN" type="number" value="7" min="1" max="365" style="width:56px"> days</label>
      <button id="runBtn">⏩ Run</button>
      <span class="sep"></span>
      <button id="resetBtn" class="danger" title="Restart from Day 1 with the current setup (keeps your map & settings)">↺ Reset sim</button>
      <span id="runStatus" class="muted"></span>
    </div>
    <div id="ticker"></div>
  </section>
  <section id="right">
    <nav id="tabs"></nav>
    <div id="panel"></div>
  </section>
</main>

<script>
'use strict';
/* =====================================================================
   Village Economy Sandbox
   - World (config) = products, building types, placed buildings,
     villagers, traveller types, settings. Saved to browser + JSON export.
   - Sim (state)    = clock, cash, stock, agents, logs, daily history.
   One tick = one game minute. Prices are constant (set per product).
   ===================================================================== */
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TILE=32;
const STORE_KEY='village-econ-world-v1', PIN_KEY='village-econ-pins-v1';
const REASONS={'not sold':'No building in the village sells it','closed':'Every seller was closed','out of stock':'Every open seller was out of stock','no money':'Could not afford it','no trip':'Routine never took them shopping (or nothing was due when they went)','no time':'Traveller left before buying it'};
const COLORS=['#6fa8dc','#f2b75b','#7fc97f','#ef6f6c','#b39ddb','#4dd0e1','#ffb74d','#f48fb1','#aed581','#90a4ae','#ce93d8','#80cbc4'];

const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){
  const el=document.createElement(tag), props={};
  for(const k in attrs||{}){const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v; else if(k==='style') el.style.cssText=v; else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked') props[k]=v; else el.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat(Infinity)) if(c!=null&&c!==false) el.append(c instanceof Node?c:String(c));
  Object.assign(el,props); return el;
}
const toMin=s=>{const [a,b]=String(s||'0:0').split(':').map(Number); return ((a||0)*60+(b||0))%1440;};
const fmtT=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const g=n=>{n=Math.round(n*100)/100; return (n<0?'−':'')+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2})+'g';};
const uid=p=>p+'_'+Math.random().toString(36).slice(2,8);
const mask=s=>s.split('').map(c=>c==='1'?1:0);
const clone=o=>JSON.parse(JSON.stringify(o));
const sum=a=>a.reduce((x,y)=>x+y,0);

/* ============================ DEFAULT WORLD ============================ */
function defaultWorld(){
  const P=(id,name,icon,price,cost,service=false)=>({id,name,icon,price,cost,service});
  const products=[
    P('bread','Bread','🍞',12,5), P('croissant','Croissant','🥐',18,7), P('milk','Milk','🥛',8,4),
    P('eggs','Eggs','🥚',6,3), P('veg','Vegetables','🥕',10,4), P('fruit','Fruit','🍎',9,4),
    P('cheese','Cheese','🧀',25,12), P('ticket','Museum ticket','🎟️',30,0,true), P('souvenir','Souvenir','🗿',45,18),
    P('ale','Ale','🍺',14,5), P('stew','Stew','🍲',22,9),
  ];
  const T=(id,name,icon,color,kind,w,hh,open,close,jobSlots,startCash,sells)=>({id,name,icon,color,kind,w,h:hh,open,close,jobSlots,startCash,sells:sells.map(([productId,maxStock])=>({productId,maxStock}))});
  const buildingTypes=[
    T('gate','Village Gate','🚏','#8d7b68','gate',2,2,'00:00','00:00',0,0,[]),
    T('house','House','🏠','#c98b5a','house',2,2,'00:00','00:00',0,0,[]),
    T('grocery','Grocery','🛒','#4f86b8','place',3,2,'08:00','20:00',2,600,[['bread',30],['milk',30],['eggs',40],['veg',30],['cheese',15]]),
    T('bakery','Bakery','🥖','#d1964a','place',3,2,'06:00','15:00',2,400,[['bread',40],['croissant',30]]),
    T('market',"Farmer's Market",'🧺','#6aa152','place',3,2,'06:00','13:00',1,300,[['eggs',30],['veg',40],['fruit',40],['cheese',10]]),
    T('museum','Museum','🏛️','#8f78b8','place',4,3,'10:00','17:00',1,500,[['ticket',0],['souvenir',20]]),
    T('tavern','Tavern','🍺','#a0582a','place',3,2,'16:00','23:30',2,400,[['ale',60],['stew',30]]),
  ];
  const B=(id,typeId,name,x,y)=>({id,typeId,name,x,y});
  const buildings=[
    B('b_gate','gate','Village Gate',0,8),
    B('h1','house','House 1',3,2),B('h2','house','House 2',6,2),B('h3','house','House 3',9,2),
    B('h4','house','House 4',3,13),B('h5','house','House 5',6,13),B('h6','house','House 6',9,13),
    B('b_groc','grocery','Grocery',14,2),B('b_bake','bakery','Bakery',19,2),
    B('b_mkt','market',"Farmer's Market",14,7),B('b_mus','museum','Museum',20,7),B('b_tav','tavern','Tavern',14,13),
  ];
  const D=(productId,qty,days)=>({productId,qty,days:mask(days)});
  const R=(time,action,target,days)=>({time,action,target:target||'',days:mask(days)});
  const basket=()=>[D('bread',1,'1111111'),D('veg',1,'1111111'),D('fruit',1,'1111111'),D('milk',1,'1010101'),
    D('eggs',2,'1001000'),D('cheese',1,'0000010'),D('ale',2,'0000110'),D('stew',1,'0000100'),D('ticket',1,'0000001')];
  const worker=(start,end,homeAt,workDays='1111110')=>{
    const off=workDays.split('').map(c=>c==='1'?'0':'1').join('');
    return [R(start,'work','',workDays),R(end,'shop','',workDays),R(homeAt,'home','',workDays),
      R('10:00','shop','',off),R('11:30','visit','museum',off),R('13:30','home','',off),
      R('19:00','visit','tavern','0000110'),R('22:30','home','','0000110')];
  };
  const V=(id,name,icon,homeId,jobId,wage,otherIncome,startCash,demand,routine)=>({id,name,icon,homeId,jobId,wage,otherIncome,startCash,demand,routine});
  const villagers=[
    V('v_ada','Ada','👩‍🍳','h1','b_bake',75,0,200,basket(),worker('05:30','14:30','16:00')),
    V('v_hana','Hana','👧','h1','b_bake',60,0,150,basket(),worker('06:00','15:00','16:30')),
    V('v_ben','Ben','👨‍🌾','h2','b_mkt',70,0,200,basket(),worker('05:30','13:00','14:30')),
    V('v_cora','Cora','👩‍💼','h3','b_groc',70,0,250,basket(),worker('08:00','14:00','15:30')),
    V('v_dan','Dan','🧑','h4','b_groc',60,0,120,basket(),[
      R('11:00','shop','','1111110'),R('12:30','home','','1111110'),R('14:00','work','','1111110'),R('20:00','home','','1111110'),
      R('10:00','shop','','0000001'),R('11:30','visit','museum','0000001'),R('13:30','home','','0000001'),
      R('20:15','visit','tavern','0000110'),R('23:00','home','','0000110')]),
    V('v_eli','Eli','🧐','h5','b_mus',75,0,300,[...basket().filter(d=>d.productId!=='ticket'),D('croissant',1,'0000011')],worker('09:30','17:00','18:00','0111111')),
    V('v_fay','Fay','🧔','h6','b_tav',70,0,200,basket().filter(d=>d.productId!=='ale'&&d.productId!=='stew'),[
      R('10:00','shop','','1111111'),R('11:30','home','','1111111'),R('15:45','work','','1111111'),R('23:45','home','','1111111')]),
    V('v_gus','Gus','👴','h6',null,0,35,400,[D('bread',1,'1111111'),D('veg',1,'1111111'),D('milk',1,'1010101'),D('cheese',1,'0000010'),D('ale',1,'1111111'),D('ticket',1,'0000001')],[
      R('08:30','shop','','1111111'),R('10:00','visit','market','1111110'),R('11:30','home','','1111111'),
      R('12:00','visit','museum','0000001'),R('14:00','home','','0000001'),
      R('18:30','visit','tavern','1111111'),R('21:00','home','','1111111')]),
  ];
  const W_=(productId,qty,chance)=>({productId,qty,chance});
  const travellerTypes=[
    {id:'t_tour',name:'Tourist',icon:'📸',days:mask('1111111'),perDayMin:1,perDayMax:3,arriveFrom:'09:00',arriveTo:'13:00',stayHours:5,cashMin:60,cashMax:180,
      wants:[W_('ticket',1,.9),W_('souvenir',1,.35),W_('croissant',1,.6),W_('fruit',2,.3)],visits:['museum']},
    {id:'t_wknd',name:'Weekend tourist',icon:'🧢',days:mask('0000011'),perDayMin:2,perDayMax:5,arriveFrom:'09:30',arriveTo:'14:00',stayHours:5,cashMin:80,cashMax:220,
      wants:[W_('ticket',1,.9),W_('souvenir',1,.5),W_('croissant',2,.5),W_('stew',1,.3)],visits:['museum']},
    {id:'t_trade',name:'Trader',icon:'🧳',days:mask('1111100'),perDayMin:0,perDayMax:2,arriveFrom:'07:00',arriveTo:'10:00',stayHours:3,cashMin:150,cashMax:400,
      wants:[W_('cheese',3,.7),W_('eggs',6,.5),W_('veg',5,.4)],visits:[]},
    {id:'t_wand',name:'Wanderer',icon:'🎒',days:mask('1111111'),perDayMin:1,perDayMax:2,arriveFrom:'16:00',arriveTo:'19:00',stayHours:4,cashMin:40,cashMax:120,
      wants:[W_('stew',1,.8),W_('ale',2,.7),W_('bread',1,.3)],visits:['tavern']},
  ];
  return {version:1,
    settings:{seed:42,gridW:28,gridH:18,walkSpeed:0.5,shopMinutes:6,sightseeMinutes:45,retryMinutes:60,startWeekday:0,restockNeedsCash:false,needWorker:false},
    products,buildingTypes,buildings,villagers,travellerTypes};
}
function emptyWorld(){const w=defaultWorld(); w.buildings=w.buildings.filter(b=>b.typeId==='gate'); w.villagers=[]; return w;}

/* ============================ GLOBALS ============================ */
let W=null, S=null, pins=[];
let running=false, speed=15, acc=0, tool='select', sel=null, curTab='inspect', dirty=true, hover=null, drag=null, busy=false;

function loadWorld(){
  try{const s=localStorage.getItem(STORE_KEY); if(s){const w=JSON.parse(s); if(w&&w.products) return fixWorld(w);}}catch(e){}
  return defaultWorld();
}
function fixWorld(w){ // fill missing fields so older/edited JSON still loads
  const d=defaultWorld(); w.settings=Object.assign({},d.settings,w.settings||{});
  for(const k of ['products','buildingTypes','buildings','villagers','travellerTypes']) if(!Array.isArray(w[k])) w[k]=[];
  for(const v of w.villagers){v.demand=v.demand||[]; v.routine=v.routine||[];}
  for(const t of w.travellerTypes){t.wants=t.wants||[]; t.visits=t.visits||[]; t.days=t.days||mask('1111111');}
  for(const t of w.buildingTypes){t.sells=t.sells||[];}
  return w;
}
function saveWorld(){try{localStorage.setItem(STORE_KEY,JSON.stringify(W));}catch(e){}}
function loadPins(){try{pins=JSON.parse(localStorage.getItem(PIN_KEY)||'[]')||[];}catch(e){pins=[];}}
function savePins(){try{localStorage.setItem(PIN_KEY,JSON.stringify(pins));}catch(e){}}

/* ============================ LOOKUPS ============================ */
const prod=id=>W.products.find(p=>p.id===id);
const btype=id=>W.buildingTypes.find(t=>t.id===id);
const bById=id=>id?W.buildings.find(b=>b.id===id):null;
const typeOf=b=>btype(b.typeId);
const vilOf=a=>W.villagers.find(v=>v.id===a.vid);
const agentOf=vid=>S.agents.find(a=>a.vid===vid);
const weekday=()=>(S.day-1+(Number(W.settings.startWeekday)||0))%7;
function door(b){const t=typeOf(b)||{w:2,h:2}; return {x:b.x+t.w/2,y:Math.min(W.settings.gridH-0.3,b.y+t.h+0.35)};}
const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
const gate=()=>W.buildings.find(b=>typeOf(b)?.kind==='gate');
const sells=(b,pid)=>!!typeOf(b)?.sells.some(s=>s.productId===pid);
function isOpenAt(b,m){const t=typeOf(b); if(!t) return false; const o=toMin(t.open),c=toMin(t.close);
  if(o===c) return true; return o<c? (m>=o&&m<c) : (m>=o||m<c);}
function staffed(b){return S.agents.some(a=>a.at===b.id&&a.steps[0]&&a.steps[0].t==='idle'&&a.steps[0].work);}
function canSell(b){const t=typeOf(b); if(!isOpenAt(b,S.minute)) return false;
  if(W.settings.needWorker&&t&&t.jobSlots>0&&!staffed(b)) return false; return true;}
function nearestOfType(from,typeId){let best=null,bd=1e9; for(const b of W.buildings){ if(b.typeId!==typeId) continue; const d=dist(from,door(b)); if(d<bd){bd=d;best=b;} } return best;}
function villageMoney(){return sum(S.agents.filter(a=>a.kind==='vil').map(a=>a.cash))+sum(Object.values(S.bs).map(b=>b.cash));}

/* ============================ RNG (seeded) ============================ */
function rnd(){S.rng=(S.rng+0x6D2B79F5)|0; let t=S.rng; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296;}
function rint(a,b){a=Math.round(+a||0);b=Math.round(+b||0); if(b<a)[a,b]=[b,a]; return a+Math.floor(rnd()*(b-a+1));}

/* ============================ SIM STATE ============================ */
function newT(){return {startMoney:villageMoney(),sales:{},salesBP:{},revByB:{},wagesByB:{},restockByB:{},unmet:{},travellers:0,travSpend:0,travCashIn:0,travCashOut:0,otherIncome:0,wages:0,restock:0,villagerSpend:0,adjust:0};}
function resetSim(){
  S={day:1,minute:0,rng:(Number(W.settings.seed)>>>0)||1,bs:{},agents:[],spawnQ:[],log:[],history:[],T:null,started:false,dayStarted:false,travCounter:0,agentCounter:0,initialMoney:0,totals:{in:0,out:0,adj:0}};
  S.T={adjust:0};
  syncState();
  S.initialMoney=villageMoney();
  startDay(); S.started=true;
  running=false; updatePlay(); dirty=true;
}
function adjust(amount,why){ if(!amount) return; if(S.started){S.T.adjust+=amount; S.totals.adj+=amount; logTx('adjust',amount>0?'(you)':why,amount>0?why:'(you)',Math.abs(amount),amount>0?'money added by an edit':'money removed by an edit');} }
function computeNeed(v,wd){const need={}; for(const d of v.demand){ if(d.days&&d.days[wd]&&d.qty>0&&prod(d.productId)) need[d.productId]=(need[d.productId]||0)+(+d.qty);} return need;}
function syncState(){
  // buildings
  for(const b of W.buildings){ if(!S.bs[b.id]){ const t=typeOf(b); S.bs[b.id]={cash:+(t?.startCash)||0,stock:{},life:{rev:0,wages:0,restock:0}}; adjust(+(t?.startCash)||0,b.name); } }
  // starting inventory: a new building (or a product newly added to a type) starts with full shelves, free of charge
  for(const b of W.buildings){ const t=typeOf(b), bs=S.bs[b.id]; if(!t) continue;
    for(const s_ of t.sells){ if(!(s_.productId in bs.stock)) bs.stock[s_.productId]=Math.max(0,Math.floor(+s_.maxStock||0)); } }
  for(const id of Object.keys(S.bs)) if(!bById(id)){ adjust(-S.bs[id].cash,'(removed building)'); delete S.bs[id]; }
  // villagers -> agents
  for(const v of W.villagers){ let a=agentOf(v.id);
    if(!a){ const hb=bById(v.homeId); const p=hb?door(hb):{x:W.settings.gridW/2,y:W.settings.gridH/2};
      a={id:'a'+(++S.agentCounter),kind:'vil',vid:v.id,name:v.name,icon:v.icon,x:p.x,y:p.y,px:p.x,py:p.y,cash:+v.startCash||0,
        steps:hb?[{t:'idle',b:hb.id,label:'at home in'}]:[{t:'idle',b:null}],pending:[],at:hb?hb.id:null,base:hb?hb.id:null,
        need:{},bought:{},lastFail:{},worked:false,spentToday:0,earnedToday:0};
      S.agents.push(a); adjust(a.cash,v.name); }
    a.name=v.name; a.icon=v.icon; a.need=computeNeed(v,weekday()); }
  for(const a of [...S.agents]) if(a.kind==='vil'&&!vilOf(a)){ adjust(-a.cash,'(removed villager)'); S.agents.splice(S.agents.indexOf(a),1); }
  // clean dangling references
  for(const a of S.agents){ if(a.base&&!bById(a.base)) a.base=null; if(a.at&&!bById(a.at)) a.at=null;
    if(a.steps.some(s=>s.b&&!bById(s.b))) a.steps=a.kind==='vil'?[]:[{t:'idle',b:null}]; }
}
function logTx(type,from,to,amt,note){S.log.push({d:S.day,m:S.minute,type,from,to,amt,note}); if(S.log.length>6000) S.log.splice(0,1000);}
function addUnmet(pid,reason,n){ if(n<=0) return; const u=S.T.unmet[pid]||(S.T.unmet[pid]={}); u[reason]=(u[reason]||0)+n; }
function remaining(a){return Object.keys(a.need).filter(p=>prod(p)&&a.need[p]-(a.bought[p]||0)>0);}

/* ============================ DAY CYCLE ============================ */
function startDay(){
  S.T=newT(); S.T.adjust=0; S.dayStarted=true;
  const wd=weekday();
  for(const a of S.agents) if(a.kind==='vil'){ const v=vilOf(a); a.need=v?computeNeed(v,wd):{}; a.bought={}; a.lastFail={}; a.worked=false; a.spentToday=0; a.earnedToday=0; }
  S.spawnQ=[];
  for(const tt of W.travellerTypes){ if(!tt.days||!tt.days[wd]) continue;
    const n=rint(tt.perDayMin,tt.perDayMax);
    for(let i=0;i<n;i++){ const at=rint(toMin(tt.arriveFrom),Math.max(toMin(tt.arriveFrom),toMin(tt.arriveTo))); const cash=rint(tt.cashMin,tt.cashMax);
      const need={}; for(const w of tt.wants){ if(rnd()<(+w.chance)) need[w.productId]=(need[w.productId]||0)+(+w.qty); }
      S.spawnQ.push({ttid:tt.id,at,cash,need}); } }
  S.spawnQ.sort((a,b)=>a.at-b.at);
}
function endDay(){
  const T=S.T;
  for(const a of S.agents.filter(a=>a.kind==='trav')) travLeave(a);
  for(const a of S.agents){ for(const pid of remaining(a)) addUnmet(pid,a.lastFail[pid]||'no trip',a.need[pid]-(a.bought[pid]||0)); }
  // payroll + outside income (paid at midnight)
  for(const a of S.agents){ const v=vilOf(a); if(!v) continue;
    const jb=bById(v.jobId);
    if(a.worked&&jb&&+v.wage>0){ const bs=S.bs[jb.id]; const amt=+v.wage; bs.cash-=amt; a.cash+=amt; a.earnedToday+=amt; bs.life.wages+=amt;
      T.wages+=amt; T.wagesByB[jb.id]=(T.wagesByB[jb.id]||0)+amt; logTx('wage',jb.name,v.name,amt,'daily wage'); }
    if(+v.otherIncome>0){ const amt=+v.otherIncome; a.cash+=amt; a.earnedToday+=amt; T.otherIncome+=amt; S.totals.in+=amt; logTx('income','Outside',v.name,amt,'outside income'); } }
  const vc=sum(S.agents.filter(a=>a.kind==='vil').map(a=>a.cash)), bc=sum(Object.values(S.bs).map(b=>b.cash));
  const bCash={}; for(const id in S.bs) bCash[id]=S.bs[id].cash;
  const revenue=sum(Object.values(T.sales).map(s=>s.rev)), salesQty=sum(Object.values(T.sales).map(s=>s.qty));
  const unmetTotal=sum(Object.values(T.unmet).map(u=>sum(Object.values(u))));
  S.history.push({day:S.day,wd:weekday(),villagerCash:vc,buildingCash:bc,villageMoney:vc+bc,startMoney:T.startMoney,revenue,salesQty,unmetTotal,
    travSpend:T.travSpend,villagerSpend:T.villagerSpend,travellers:T.travellers,wages:T.wages,restock:T.restock,otherIncome:T.otherIncome,
    inflow:T.travSpend+T.otherIncome,outflow:T.restock,adjust:T.adjust,bCash,revByB:{...T.revByB},sales:clone(T.sales),unmet:clone(T.unmet)});
  S.dayStarted=false;
}
function restock(b){
  const t=typeOf(b), bs=S.bs[b.id]; if(!t||!bs) return;
  for(const s of t.sells){ const p=prod(s.productId); if(!p||p.service) continue;
    let n=Math.max(0,Math.floor(+s.maxStock||0)-(bs.stock[p.id]||0));
    if(W.settings.restockNeedsCash&&+p.cost>0) n=Math.min(n,Math.max(0,Math.floor(bs.cash/ +p.cost)));
    if(n<=0) continue; const c=n*(+p.cost||0);
    bs.cash-=c; bs.stock[p.id]=(bs.stock[p.id]||0)+n; bs.life.restock+=c;
    S.T.restock+=c; S.T.restockByB[b.id]=(S.T.restockByB[b.id]||0)+c; S.totals.out+=c;
    logTx('restock',b.name,'Outside',c,`${n}× ${p.icon} ${p.name}`); }
}
function tick(){
  if(S.minute===0&&!S.dayStarted) startDay();
  const m=S.minute;
  for(const b of W.buildings){ const t=typeOf(b); if(t&&t.sells.length&&toMin(t.open)===m) restock(b); }
  while(S.spawnQ.length&&S.spawnQ[0].at<=m) spawnTraveller(S.spawnQ.shift());
  const wd=weekday();
  for(const a of S.agents){ if(a.kind!=='vil') continue; const v=vilOf(a); if(!v) continue;
    for(const r of v.routine) if(r.days&&r.days[wd]&&toMin(r.time)===m) a.pending.push(r); }
  for(const a of [...S.agents]) stepAgent(a);
  S.minute++;
  if(S.minute>=1440){ endDay(); S.minute=0; S.day++; startDay(); }
}

/* ============================ AGENTS ============================ */
function chooseSeller(a,pid){
  const p=prod(pid); const sellers=W.buildings.filter(b=>sells(b,pid));
  if(!sellers.length) return {fail:'not sold'};
  sellers.sort((x,y)=>dist(a,door(x))-dist(a,door(y)));
  const open=sellers.filter(canSell); if(!open.length) return {fail:'closed'};
  const stocked=open.filter(b=>p.service||(S.bs[b.id]?.stock[pid]||0)>0); if(!stocked.length) return {fail:'out of stock'};
  return {b:stocked[0]};
}
function planTrip(a,pids){
  const groups=new Map();
  for(const pid of pids){ const r=chooseSeller(a,pid); if(r.fail){a.lastFail[pid]=r.fail; continue;} groups.set(r.b.id,r.b); }
  const list=[...groups.values()], steps=[]; let pos={x:a.x,y:a.y};
  while(list.length){ list.sort((p,q)=>dist(pos,door(p))-dist(pos,door(q))); const b=list.shift();
    steps.push({t:'walk',b:b.id},{t:'wait',left:+W.settings.shopMinutes||1,b:b.id,label:'shopping'},{t:'buy',b:b.id}); pos=door(b); }
  return steps;
}
function doBuy(a,bid){
  const b=bById(bid); if(!b) return; const bs=S.bs[b.id]; const ok=canSell(b);
  for(const pid of remaining(a)){ if(!sells(b,pid)) continue;
    if(!ok){a.lastFail[pid]='closed'; continue;}
    const p=prod(pid), need=a.need[pid]-(a.bought[pid]||0), price=+p.price||0;
    const avail=p.service?Infinity:(bs.stock[pid]||0), afford=price>0?Math.floor(a.cash/price+1e-9):Infinity;
    const n=Math.min(need,avail,afford);
    if(n>0){ const amt=n*price; a.cash-=amt; bs.cash+=amt; bs.life.rev+=amt; if(!p.service) bs.stock[pid]-=n;
      a.bought[pid]=(a.bought[pid]||0)+n; a.spentToday=(a.spentToday||0)+amt;
      const s=S.T.sales[pid]||(S.T.sales[pid]={qty:0,rev:0}); s.qty+=n; s.rev+=amt;
      S.T.revByB[b.id]=(S.T.revByB[b.id]||0)+amt; const bp=S.T.salesBP[b.id]||(S.T.salesBP[b.id]={}); bp[pid]=(bp[pid]||0)+n;
      if(a.kind==='trav'){S.T.travSpend+=amt; S.totals.in+=amt;} else S.T.villagerSpend+=amt;
      logTx('sale',a.name,b.name,amt,`${n}× ${p.icon} ${p.name}`); }
    if(n<need) a.lastFail[pid]=avail<need?'out of stock':'no money';
  }
}
function returnToBase(a){
  const v=vilOf(a); let base=bById(a.base)||bById(v?.homeId);
  if(!base){a.steps=[{t:'idle',b:null}]; return;}
  const lbl=base.id===v?.homeId?'at home in':(base.id===v?.jobId&&a.worked?'working at':'hanging around');
  const idle={t:'idle',b:base.id,label:lbl,work:lbl==='working at'};
  a.steps=a.at===base.id?[idle]:[{t:'walk',b:base.id},idle];
}
function startAction(a,r){
  const v=vilOf(a); if(!v) return;
  if(r.action==='home'){ const hb=bById(v.homeId); a.base=hb?hb.id:null; a.steps=hb?[{t:'walk',b:hb.id},{t:'idle',b:hb.id,label:'at home in'}]:[{t:'idle',b:null}]; }
  else if(r.action==='work'){ const jb=bById(v.jobId); if(!jb) return; a.base=jb.id; a.steps=[{t:'walk',b:jb.id},{t:'work'},{t:'idle',b:jb.id,label:'working at',work:true}]; }
  else if(r.action==='visit'){ const tb=nearestOfType(a,r.target); if(!tb) return; a.base=tb.id;
    a.steps=[{t:'walk',b:tb.id},{t:'wait',left:+W.settings.shopMinutes||1,b:tb.id,label:'browsing'},{t:'buy',b:tb.id},{t:'idle',b:tb.id,label:'visiting'}]; }
  else if(r.action==='shop'){ a.steps=planTrip(a,remaining(a)); }
}
function spawnTraveller(sp){
  const tt=W.travellerTypes.find(t=>t.id===sp.ttid); if(!tt) return;
  const gt=gate(); const p=gt?door(gt):{x:0.5,y:W.settings.gridH/2};
  const a={id:'a'+(++S.agentCounter),kind:'trav',ttid:tt.id,name:`${tt.name} #${++S.travCounter}`,icon:tt.icon,x:p.x,y:p.y,px:p.x,py:p.y,
    cash:sp.cash,startCash:sp.cash,need:sp.need,bought:{},lastFail:{},steps:[],pending:[],at:gt?gt.id:null,
    departAt:Math.min(1439,sp.at+Math.round((+tt.stayHours||1)*60)),retryAt:S.minute+(+W.settings.retryMinutes||60),spentToday:0,leaving:false};
  const steps=planTrip(a,remaining(a));
  let pos=steps.length?door(bById(steps[steps.length-1].b)):p, lastB=steps.length?steps[steps.length-1].b:(gt&&gt.id);
  for(const vt of tt.visits||[]){ const b=nearestOfType(pos,vt); if(!b) continue;
    steps.push({t:'walk',b:b.id},{t:'wait',left:+W.settings.sightseeMinutes||30,b:b.id,label:'sightseeing'},{t:'buy',b:b.id}); pos=door(b); lastB=b.id; }
  steps.push({t:'idle',b:lastB||null,label:'strolling near'});
  a.steps=steps; S.agents.push(a); S.T.travellers++; S.T.travCashIn+=a.cash;
  logTx('arrive','Outside',a.name,a.cash,'arrives carrying cash');
}
function travLeave(a){
  for(const pid of remaining(a)) addUnmet(pid,a.lastFail[pid]||'no time',a.need[pid]-(a.bought[pid]||0));
  S.T.travCashOut+=a.cash; logTx('leave',a.name,'Outside',a.cash,`leaves (spent ${g(a.startCash-a.cash)})`);
  const i=S.agents.indexOf(a); if(i>=0) S.agents.splice(i,1);
}
function stepAgent(a){
  a.px=a.x; a.py=a.y; const m=S.minute;
  if(a.kind==='trav'){
    if(!a.leaving&&m>=a.departAt){ a.leaving=true; const gt=gate(); a.steps=gt?[{t:'walk',b:gt.id},{t:'leave'}]:[{t:'walkxy',x:0.3,y:W.settings.gridH/2},{t:'leave'}]; }
    else if(!a.leaving){ const s=a.steps[0];
      if((!s||s.t==='idle')&&m>=a.retryAt){ a.retryAt=m+(+W.settings.retryMinutes||60); const rem=remaining(a);
        if(rem.length){ const trip=planTrip(a,rem); if(trip.length) a.steps=[...trip,{t:'idle',b:trip[trip.length-1].b,label:'strolling near'}]; } } }
  } else {
    const s=a.steps[0];
    if((!s||s.t==='idle')&&a.pending.length) startAction(a,a.pending.shift());
    if(!a.steps.length) returnToBase(a);
  }
  for(let guard=0;guard<8;guard++){
    const s=a.steps[0]; if(!s) return;
    switch(s.t){
      case 'walk': case 'walkxy': {
        let tx,ty; if(s.t==='walk'){const b=bById(s.b); if(!b){a.steps.shift(); continue;} ({x:tx,y:ty}=door(b));} else {tx=s.x;ty=s.y;}
        a.at=null; const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy),sp=+W.settings.walkSpeed||0.5;
        if(d<=sp){a.x=tx;a.y=ty;a.at=s.t==='walk'?s.b:null;a.steps.shift();} else {a.x+=dx/d*sp;a.y+=dy/d*sp;}
        return; }
      case 'wait': if(--s.left<=0) a.steps.shift(); return;
      case 'idle': return;
      case 'buy': doBuy(a,s.b); a.steps.shift(); continue;
      case 'work': a.worked=true; a.steps.shift(); continue;

    }
  }
}
function statusOf(a){
  const s=a.steps[0]; const bn=id=>bById(id)?.name||'?';
  if(!s) return 'idle';
  switch(s.t){case 'walk': return (a.leaving?'leaving via ':'walking to ')+bn(s.b); case 'walkxy': return 'leaving the village';
    case 'wait': return `${s.label} at ${bn(s.b)}`; case 'idle': return s.b?`${s.label||'at'} ${bn(s.b)}`:'standing around'; default: return s.t;}
}
const visible=a=>!(a.at&&a.steps[0]&&a.steps[0].t!=='walk'&&a.steps[0].t!=='walkxy');

/* ============================ RUN CONTROL ============================ */
function updatePlay(){const b=$('#playBtn'); b.textContent=running?'⏸ Pause':'▶ Play'; b.classList.toggle('primary',!running);}
function runDays(n,done){
  if(busy) return; busy=true; running=false; updatePlay();
  const target=S.day+n; const st=$('#runStatus');
  const chunk=()=>{ const t0=performance.now();
    while(S.day<target&&performance.now()-t0<40) for(let i=0;i<60&&S.day<target;i++) tick();
    st.textContent=S.day<target?`simulating… day ${S.day}/${target}`:'';
    dirty=true; if(S.day<target) setTimeout(chunk,0); else {busy=false; done&&done();} };

const cv=$('#map'), ctx=cv.getContext('2d'); let bg=null;
function sizeCanvas(){const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=W.settings.gridW*TILE*dpr; cv.height=W.settings.gridH*TILE*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); bg=null;}
function makeBg(){
  const c=document.createElement('canvas'); c.width=W.settings.gridW*TILE; c.height=W.settings.gridH*TILE; const x=c.getContext('2d');
  let seed=7; const r=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  for(let i=0;i<W.settings.gridW;i++) for(let j=0;j<W.settings.gridH;j++){ x.fillStyle=(i+j)%2?'#4a7c3f':'#4f8343'; x.fillRect(i*TILE,j*TILE,TILE,TILE);
    if(r()<.25){x.fillStyle='rgba(255,255,255,.06)'; x.fillRect(i*TILE+r()*28,j*TILE+r()*28,3,3);} }
  x.strokeStyle='rgba(0,0,0,.08)'; for(let i=0;i<=W.settings.gridW;i++){x.beginPath();x.moveTo(i*TILE+.5,0);x.lineTo(i*TILE+.5,c.height);x.stroke();}
  for(let j=0;j<=W.settings.gridH;j++){x.beginPath();x.moveTo(0,j*TILE+.5);x.lineTo(c.width,j*TILE+.5);x.stroke();}

function rr(c,x,y,w,h_,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h_,r);c.arcTo(x+w,y+h_,x,y+h_,r);c.arcTo(x,y+h_,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function darkness(m){if(m<300) return .5; if(m<420) return .5*(1-(m-300)/120); if(m<1140) return 0; if(m<1320) return .5*(m-1140)/180; return .5;}

}
function drawBuilding(b,t,inside){

function chart(cv_,series,opt={}){
  const dpr=Math.min(2,window.devicePixelRatio||1), Wc=cv_.clientWidth||400, Hc=opt.h||170; cv_.width=Wc*dpr; cv_.height=Hc*dpr; cv_.style.height=Hc+'px';
  const c=cv_.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,Wc,Hc); c.font='11px system-ui';
  const n=Math.max(0,...series.map(s=>s.data.length));
  if(!n){c.fillStyle='#9aa1ad'; c.fillText('No completed days yet — play or run the sim.',10,Hc/2); return;}
  let lo=0,hi=0; for(const s of series) for(const v of s.data){ if(v<lo) lo=v; if(v>hi) hi=v; } if(hi===lo) hi=lo+1; const span=hi-lo; hi+=span*.05; if(lo<0) lo-=span*.05;
  const legendRows=Math.ceil(series.length/4), L=52,R=8,Tp=8,B=18+legendRows*14, pw=Wc-L-R, ph=Hc-Tp-B;
  const X=i=>L+(n===1?pw/2:i/(n-1)*pw), Y=v=>Tp+ph-(v-lo)/(hi-lo)*ph;
  c.strokeStyle='#3c4352'; c.fillStyle='#9aa1ad'; c.textAlign='right'; c.textBaseline='middle';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4, y=Y(v); c.beginPath(); c.moveTo(L,y); c.lineTo(Wc-R,y); c.stroke(); c.fillText(Math.round(v).toLocaleString(),L-4,y);}
  if(lo<0&&hi>0){c.strokeStyle='#777'; c.beginPath(); c.moveTo(L,Y(0)); c.lineTo(Wc-R,Y(0)); c.stroke();}
  c.textAlign='center'; c.textBaseline='top'; const x0=opt.x0||1; const step=Math.max(1,Math.ceil(n/8));
  for(let i=0;i<n;i+=step) c.fillText('d'+(x0+i),X(i),Tp+ph+3);
  for(const s of series){ c.strokeStyle=s.color; c.lineWidth=2; c.beginPath(); s.data.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v))); c.stroke();
    if(n<=40){c.fillStyle=s.color; s.data.forEach((v,i)=>{c.beginPath(); c.arc(X(i),Y(v),2.2,0,7); c.fill();});} }
  c.textAlign='left'; c.textBaseline='middle'; const colW=(Wc-L)/4;
  series.forEach((s,i)=>{const lx=L+(i%4)*colW, ly=Hc-legendRows*14+Math.floor(i/4)*14+5; c.fillStyle=s.color; c.fillRect(lx,ly-4,10,8); c.fillStyle='#cfd3da';
    let name=s.name; while(c.measureText(name).width>colW-18&&name.length>3) name=name.slice(0,-2)+'…'; c.fillText(name,lx+14,ly);});
}

    h('button',{onclick:()=>fileIn.click()},'📂 Open file…'),fileIn,
    h('button',{class:'primary',onclick:()=>loadFromText(ta.value,msg)},'⬆ Load JSON from box'),msg),ta);
  p.append(h('h3',null,'Start over'),h('div',{class:'row'},confirmBtn('Load default village',()=>{W=defaultWorld(); afterWorldReplace();}),confirmBtn('Empty map (keep products & types)',()=>{const w=emptyWorld(); w.products=W.products; w.buildingTypes=W.buildingTypes; w.travellerTypes=W.travellerTypes; w.settings=W.settings; w.buildings=[]; W=w; afterWorldReplace();})));
};
function loadFromText(t,msg){try{const w=JSON.parse(t); if(!w||!Array.isArray(w.products)) throw new Error('not a village JSON'); W=fixWorld(w); afterWorldReplace(); msg.textContent='Loaded ✔';}catch(e){msg.textContent='Could not load: '+e.message;}}
function afterWorldReplace(){saveWorld(); sel=null; tool='select'; sizeCanvas(); resetSim(); renderTools(); showTab(curTab);}

/* ---------- Rules ---------- */
PANELS.rules=p=>{p.append(h('div',{class:'rules',html:`
<h2>How this simulation works (v1 – constant prices)</h2>
<p>Everything below is a placeholder rule you can question and replace. The sim is deliberately simple so you can see each mechanic in isolation.</p>
<h3>Time</h3><ul><li>1 tick = 1 game minute; a day is 00:00–23:59. Day 1 is a Monday (changeable).</li><li>Wages and outside income are paid at midnight. Daily statistics are recorded at midnight.</li></ul>
<h3>Money accounts</h3><ul><li><b>Villagers</b> each have a wallet. <b>Buildings</b> each have a till. Together these are the <b>village money</b>.</li>
<li><b>Outside</b> is everything beyond the village. Money only enters the village from <i>traveller purchases</i> and <i>villager outside income</i>, and only leaves through <i>shop restocking</i>. The Stats tab checks that this always adds up.</li>
<li>Villager purchases and wages just move money around inside the village.</li></ul>
<h3>Buildings</h3><ul><li><b>Places</b> sell products during opening hours. They start with full shelves (free). Every day at opening time they refill every product to its max stock, paying the product's <code>cost</code> per unit to the Outside. They may go into debt (unless the setting says otherwise).</li>
<li>Place profits just accumulate in the till — nobody owns the building yet. (A candidate for your next mechanic!)</li>
<li><b>Houses</b> are where villagers live. The <b>Gate</b> is where travellers enter/leave.</li></ul>
<h3>Villagers</h3><ul><li><b>Demand</b>: each item says product, quantity and weekdays. On a given day the due items form today's shopping list.</li>
<li><b>Routine</b>: steps at set times and weekdays. <code>work</code> = go to job (counts as worked today). <code>shop</code> = go to the nearest open seller with stock for each item still due, buy, then return to where they were based (home/work/visit). <code>visit</code> = go to the nearest building of a type, buy anything due that it sells, and stay. <code>home</code> = go home.</li>
<li>If a step fires while they are busy, it waits in a queue until they finish.</li>
<li>Purchases: buy as many as needed, limited by stock and cash. Anything not bought by midnight is recorded as <b>unmet demand</b> with a reason.</li></ul>
<h3>Travellers</h3><ul><li>Per traveller type and weekday: a random count (min–max) arrive at random times in the window with random cash. Each "want" is rolled with its chance.</li>
<li>They shop on arrival, then sightsee the listed places, retry missing items every hour, and leave when their stay ends (or at midnight). Unspent cash leaves with them.</li></ul>
<h3>Unmet-demand reasons</h3><ul>${Object.entries(REASONS).map(([k,v])=>`<li><code>${k}</code> — ${v}</li>`).join('')}</ul>
<h3>Things that are NOT simulated yet</h3><ul><li>Dynamic prices, production chains (bakery making bread from wheat), building ownership/profits, rent, savings decisions, hunger/substitution, the player.</li></ul>`}));};

/* ============================ MAIN LOOP ============================ */
function hud(){
  $('#clock').textContent=`Day ${S.day} · ${DAYS[weekday()]} · ${fmtT(S.minute)}`;
  $('#hudmoney').textContent=`Village money ${g(villageMoney())} · ${S.agents.filter(a=>a.kind==='trav').length} travellers in town`;
  const lines=[]; for(let i=S.log.length-1;i>=0&&lines.length<6;i--) lines.push(fmtLog(S.log[i])); $('#ticker').textContent=lines.join('\n')||'Press ▶ Play to start the day.';
}
let lastT=performance.now(), lastLive=0;
function frame(now){
  const dt=Math.min(0.25,(now-lastT)/1000); lastT=now;
  if(running&&!busy){ acc+=dt*speed; let n=Math.floor(acc); acc-=n; if(n>0){ for(let i=0;i<n;i++) tick(); dirty=true; } }
  draw();
  if(dirty&&now-lastLive>250){ lastLive=now; dirty=false; hud(); if(liveFn) try{liveFn();}catch(e){console.error(e);} }
  requestAnimationFrame(frame);
}
$('#playBtn').onclick=()=>{running=!running; updatePlay();};
$('#speed').onchange=e=>{speed=+e.target.value;};
$('#endDayBtn').onclick=()=>runDays(1);
$('#runBtn').onclick=()=>runDays(Math.max(1,Math.min(365,+$('#runN').value||1)));
$('#resetBtn').onclick=()=>{resetSim(); showTab(curTab);};
window.addEventListener('resize',()=>{dirty=true; if(curTab==='stats') showTab('stats',true);});

W=loadWorld(); loadPins(); sizeCanvas(); resetSim(); renderTools(); showTab('inspect'); requestAnimationFrame(frame);
window.sim={get W(){return W;},get S(){return S;},runDays,tick,resetSim,villageMoney};
</script>
